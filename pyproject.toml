[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slopgate"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["hypothesis>=6.170.17", "fastembed>=0.9.1"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
slopgate = "slopgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
